mysql:
  secrets:
    MYSQL_ROOT_PASSWORD: secret
    MYSQL_USER: secret
    MYSQL_PASSWORD: secret

todoapp:
  namespace: todoapp
  image:
    repository: greqit/todoapp
    tag: "4.0.1"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  secrets:
    SECRET_KEY: secret
    DB_NAME: secret
    DB_USER: secret
    DB_PASSWORD: secret
    DB_HOST: secret

  hpa:
    minReplicas: 2
    maxReplicas: 5
    cpu:
      avarageUtilization: 70
    memory:
      avarageUtilization: 70

  volumes:
    persistentVolume:
      capacity: "1Gi"
    persistentVolumeClaim:
      requestStorage: "1Gi"